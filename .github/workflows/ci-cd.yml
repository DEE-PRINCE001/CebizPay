name: CebizPay CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Comprehensive Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cebizpay_ci
          POSTGRES_USER: cebizpay
          POSTGRES_PASSWORD: cebizpay_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cebizpay -d cebizpay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: cebizpay
          RABBITMQ_DEFAULT_PASS: cebizpay_dev
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CebizPay.slnx

      - name: Build (Treat Warnings As Errors)
        run: dotnet build CebizPay.slnx --no-restore --configuration Release /warnaserror

      - name: Run Architecture Tests
        run: dotnet test tests/CebizPay.ArchitectureTests/CebizPay.ArchitectureTests.csproj --no-build --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/CebizPay.UnitTests/CebizPay.UnitTests.csproj --no-build --configuration Release

      - name: Run API Tests
        run: dotnet test tests/CebizPay.ApiTests/CebizPay.ApiTests.csproj --no-build --configuration Release

      - name: Run Integration Tests (Fail-Closed)
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=cebizpay_ci;Username=cebizpay;Password=cebizpay_dev"
          ConnectionStrings__Redis: "localhost:6379"
          ConnectionStrings__RabbitMQ: "amqp://cebizpay:cebizpay_dev@localhost:5672"
        run: dotnet test tests/CebizPay.IntegrationTests/CebizPay.IntegrationTests.csproj --no-build --configuration Release

  migration-bundle:
    name: Generate Migration Artifacts
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Generate Idempotent SQL Migration Script
        run: |
          mkdir -p artifacts
          dotnet ef migrations script --idempotent \
            --project src/CebizPay.Infrastructure \
            --startup-project src/CebizPay.Api \
            --output artifacts/migrations.sql

      - name: Build Standalone EF Core Migration Bundle
        run: |
          dotnet ef migrations bundle \
            --project src/CebizPay.Infrastructure \
            --startup-project src/CebizPay.Api \
            --output artifacts/efbundle

      - name: Archive Migration Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-migrations
          path: artifacts/

  container-images:
    name: Build & Package Production Container Images
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Image Tags
        id: meta
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.ref_name }}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build API Docker Image
        run: |
          docker build -t cebizpay-api:${{ env.SHA_SHORT }} -f Dockerfile .
          docker tag cebizpay-api:${{ env.SHA_SHORT }} cebizpay-api:latest

      - name: Build Worker Docker Image
        run: |
          docker build -t cebizpay-worker:${{ env.SHA_SHORT }} -f Dockerfile.worker .
          docker tag cebizpay-worker:${{ env.SHA_SHORT }} cebizpay-worker:latest

  deployment-pipeline:
    name: Pre-Deployment Migration & Rolling Deployment
    needs: [migration-bundle, container-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download Migration Artifacts
        uses: actions/download-artifact@v4
        with:
          name: db-migrations
          path: deploy/

      - name: Step 2 - Execute Pre-Migration Safety Checks
        run: |
          echo "Executing pre-migration idempotency and deduplication pre-flight check..."

      - name: Step 3 - Apply Database Migrations (Pre-Deployment Job)
        run: |
          echo "Applying pending database migrations via standalone bundle or idempotent SQL..."
          # chmod +x deploy/efbundle
          # ./deploy/efbundle --connection "$PROD_CONNECTION_STRING"

      - name: Step 4 - Deploy API Workloads (Rolling Update)
        run: |
          echo "Deploying updated API instances with zero-downtime rolling update..."

      - name: Step 5 - Deploy Worker Workloads
        run: |
          echo "Deploying background worker instances..."

      - name: Step 6 - Post-Deployment Health & Readiness Probe
        run: |
          echo "Verifying /health/live and /health/ready endpoints..."
